<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Universo J&M</title>

  <link rel="stylesheet" href="./css/estilo.css">
</head>

<body>

  <header class="topo">
    <a href="index.html#home" class="logo">Universo J&M</a>
    <nav class="menu">
      <a href="index.html#home">Home</a>
      <a href="index.html#historia">História</a>
      <a href="index.html#discografia">Discografia</a>
      <a href="quiz.html">Quiz</a>
      <a href="resultados.html">Resultados</a>
      <a href="login.html" id="link-conta">Entrar</a>
      <button type="button" id="btn-sair" class="btn-sair escondido" onclick="sair()">Sair</button>
    </nav>
  </header>

  <main class="auth">
    <section class="auth-card">

      <div class="auth-lateral">
        <img src="./assets/imgs/JM4.webp" alt="Jorge e Mateus">
        <div class="auth-lateral-texto">
          <span class="chamada-topo">Jorge &amp; Mateus</span>
          <p class="auth-frase">Crie a sua conta e descubra o quanto você conhece da dupla.</p>
        </div>
      </div>

      <div class="auth-form">
        <h1>Crie a sua conta</h1>
        <p class="auth-sub">Leva menos de um minuto.</p>

        <div class="campo">
          <label for="ipt_nome">Nome</label>
          <input id="ipt_nome" type="text" placeholder="Seu nome">
          <div id="div_nomeInvalido" class="aviso"></div>
        </div>

        <div class="campo">
          <label for="ipt_email">E-mail</label>
          <input id="ipt_email" type="email" placeholder="meuemail@provedor.com">
          <div id="div_emailInvalido" class="aviso"></div>
        </div>

        <div class="campo">
          <label for="ipt_senha">Senha</label>
          <div class="campo-senha">
            <input id="ipt_senha" type="password" placeholder="Mínimo de 8 caracteres">
            <button type="button" class="ver-senha" onclick="verSenha('ipt_senha', this)">Mostrar</button>
          </div>
          <div id="div_fraca" class="aviso"></div>
          <div id="div_forte" class="aviso ok"></div>
        </div>

        <div class="campo">
          <label for="ipt_confirmarSenha">Confirme a senha</label>
          <div class="campo-senha">
            <input id="ipt_confirmarSenha" type="password" placeholder="Repita a senha">
            <button type="button" class="ver-senha" onclick="verSenha('ipt_confirmarSenha', this)">Mostrar</button>
          </div>
          <div id="div_senhaDif" class="aviso"></div>
        </div>

        <button class="btn btn-dourado" onclick="cadastrar()">Cadastrar</button>

        <div id="div_msg" class="mensagem erro"></div>
        <div id="div_msgCerto" class="mensagem sucesso"></div>

        <p class="auth-troca">Já tem conta? <a href="login.html">Entrar</a></p>
      </div>

    </section>
  </main>

  <footer class="rodape">
    <p>J&M - Uma História que Virou Música. Projeto feito por João Pedro Sakamoto Murata Hashimoto.</p>
  </footer>

  <script src="./js/conta.js"></script>
</body>

</html>

<script>
  function cadastrar() {
    // .trim tira os espaços do começo e do fim
    let nome = ipt_nome.value.trim();
    let email = ipt_email.value.trim();
    let senha = ipt_senha.value.trim();
    let confirmarSenha = ipt_confirmarSenha.value.trim();

    let nomeInvalido = true;
    let emailInvalido = true;
    let senhaInvalida = true;
    let cfmSenhaInvalido = true;

    let temMaius = false;
    let temMinus = false;
    let temNum = false;
    let temSimb = false;
    let numerosPermitidos = "0123456789";
    let simbolos = "!@#$%&*_-./";

    let contarCaractere = 0;

    // nome
    if (nome.length >= 2) {
      nomeInvalido = false;
      div_nomeInvalido.innerHTML = "";
    } else {
      div_nomeInvalido.innerHTML = "Digite seu nome.";
    }

    // email: sem espaços, só um @ e domínio permitido
    if (!email.includes(" ") && email.split("@").length == 2 && (
      email.endsWith("@gmail.com") ||
      email.endsWith("@hotmail.com") ||
      email.endsWith("@outlook.com") ||
      email.endsWith("@sptech.school")
    )) {
      emailInvalido = false;
      div_emailInvalido.innerHTML = "";
    } else {
      div_emailInvalido.innerHTML = "Digite um email válido (gmail, hotmail, outlook ou sptech.school).";
    }

    // senha: percorre cada caractere e marca o que ela tem
    while (contarCaractere < senha.length) {
      let caractere = senha[contarCaractere];
      if (caractere >= "A" && caractere <= "Z") temMaius = true;
      if (caractere >= "a" && caractere <= "z") temMinus = true;
      if (numerosPermitidos.includes(caractere)) temNum = true;
      if (simbolos.includes(caractere)) temSimb = true;
      contarCaractere++;
    }

    if (temMaius && temMinus && temNum && temSimb && senha.length >= 8 && senha.length <= 45) {
      div_forte.innerHTML = "Senha forte";
      div_fraca.innerHTML = "";
      senhaInvalida = false;
    } else {
      div_fraca.innerHTML = "Senha fraca: use de 8 a 45 caracteres, com maiúscula, minúscula, número e símbolo (! @ # $ % & * _ - . /).";
      div_forte.innerHTML = "";
    }

    // confirmação
    if (confirmarSenha === senha && senha !== "") {
      cfmSenhaInvalido = false;
      div_senhaDif.innerHTML = "";
    } else {
      div_senhaDif.innerHTML = "As senhas são diferentes.";
    }

    if (nomeInvalido || emailInvalido || senhaInvalida || cfmSenhaInvalido) {
      div_msg.innerHTML = "Preencha os dados corretamente.";
      div_msgCerto.innerHTML = "";
    } else {
      div_msg.innerHTML = "";
      div_msgCerto.innerHTML = "Cadastro realizado com sucesso! Redirecionando para o login...";

      setTimeout(function () {
        window.location = "login.html";
      }, 2000);
    }
  }

  function verSenha(id, botao) {
    let campo = document.getElementById(id);

    if (campo.type == "password") {
      campo.type = "text";
      botao.innerHTML = "Ocultar";
    } else {
      campo.type = "password";
      botao.innerHTML = "Mostrar";
    }
  }
</script>
